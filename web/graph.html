<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Ops</title>
<link rel="stylesheet" href="/assets/ao.css">
<style>
  /* Team graph: orchestrator node in the middle, curved links to each agent; every agent carries an Activity feed and
     a small board of cards. Two levels share one look: All (you → sessions) and Session (main agent → sub-agents). */
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  .wrap { padding-bottom: 0; flex: none; }
  #stage { --g-bg: #070b18; --g-panel: rgba(16,24,48,.72); --g-line: rgba(120,150,255,.16); --g-txt: #e6ebff; --g-dim: #8d97b8; --g-faint: #5f6886;
    --c-prog: #6ea8ff; --c-rev: #e9c46a; --c-done: #6fdc9a; --c-bad: #ff6b7d; --c-todo: #9aa3c0;
    position: relative; flex: 1; min-height: 0; margin: 12px clamp(16px, 2.4vw, 40px) 18px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(120,150,255,.14); color: var(--g-txt);
    background: radial-gradient(1200px 800px at 50% 45%, #0d1530 0%, #080c1c 60%, #05070f 100%); }
  #stars { position: absolute; inset: 0; pointer-events: none; opacity: .8;
    background-image: radial-gradient(1px 1px at 20px 30px, #fff8, transparent), radial-gradient(1px 1px at 120px 80px, #fff6, transparent), radial-gradient(1.2px 1.2px at 220px 160px, #cfe0ff88, transparent),
      radial-gradient(1px 1px at 300px 40px, #fff5, transparent), radial-gradient(1px 1px at 380px 210px, #fff6, transparent), radial-gradient(1.4px 1.4px at 60px 240px, #fff7, transparent);
    background-size: 420px 280px; }
  #view { position: absolute; inset: 0; cursor: grab; touch-action: none; }
  #view.drag { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #links { position: absolute; left: -6000px; top: -6000px; width: 12000px; height: 12000px; overflow: visible; pointer-events: none; }
  .bar { position: absolute; z-index: 3; top: 10px; left: 10px; right: 10px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .tab { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 9px; font-size: 13px; color: var(--g-dim); background: rgba(12,18,36,.75); border: 1px solid rgba(120,150,255,.14); cursor: pointer; white-space: nowrap; }
  .tab.on { color: var(--g-txt); border-color: rgba(120,150,255,.35); background: rgba(30,44,90,.6); }
  .tab select { background: transparent; border: 0; color: var(--g-txt); font: inherit; max-width: 360px; }
  .tab select option { background: #0b1124; }
  .ctl { position: absolute; z-index: 3; right: 12px; bottom: 12px; display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: rgba(12,18,36,.8); border: 1px solid rgba(120,150,255,.14); }
  .ctl button { background: none; border: 0; color: var(--g-dim); font: 500 12px Manrope, sans-serif; padding: 6px 10px; border-radius: 7px; cursor: pointer; }
  .ctl button:hover { color: var(--g-txt); background: rgba(120,150,255,.12); }
  .legend { display: none; position: absolute; z-index: 3; left: 12px; bottom: 12px; display: flex; gap: 14px; padding: 8px 12px; border-radius: 10px; background: rgba(12,18,36,.8); border: 1px solid rgba(120,150,255,.14); font: 11px "IBM Plex Mono", monospace; color: var(--g-dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid; }

  /* node = avatar + name; group = node + panel (activity + columns) */
  .grp { position: absolute; display: flex; flex-direction: column; align-items: center; }
  .node { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
  .av { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; position: relative; }
  .av::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; background: radial-gradient(circle, var(--glow) 0%, transparent 70%); opacity: .55; }
  .av svg { position: relative; image-rendering: pixelated; }
  .av.run::after { content: ""; position: absolute; inset: -4px; border-radius: 14px; border: 1.5px solid var(--glow); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(1.08); } }
  .nm { font: 600 11.5px "IBM Plex Mono", monospace; color: var(--g-txt); white-space: nowrap; }
  .rl { font: 10px "IBM Plex Mono", monospace; color: var(--g-faint); white-space: nowrap; margin-top: -3px; }
  .panel { margin-top: 10px; display: flex; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(14,22,46,.55); border: 1px solid rgba(120,150,255,.12); backdrop-filter: blur(2px); }
  .actv { width: 214px; border-radius: 9px; background: rgba(8,12,26,.75); border: 1px solid rgba(120,150,255,.12); padding: 8px 9px 4px; }
  .ttl { font: 600 9.5px "IBM Plex Mono", monospace; letter-spacing: .14em; color: var(--g-faint); text-transform: uppercase; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .ev { border-left: 2px solid var(--c); padding: 3px 0 5px 7px; margin-bottom: 4px; }
  .ev .m { display: flex; gap: 6px; align-items: center; font: 10px "IBM Plex Mono", monospace; color: var(--g-dim); white-space: nowrap; }
  .ev .m b { color: var(--c); font-weight: 600; }
  .ev .m .tg { padding: 0 5px; border-radius: 4px; border: 1px solid rgba(110,168,255,.5); color: #a9c8ff; font-size: 9.5px; }
  .ev .m .t { margin-left: auto; color: var(--g-faint); }
  .ev .x { font: 10.5px "IBM Plex Mono", monospace; color: #c9d1ee; margin-top: 2px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
  .ev.err { --c: var(--c-bad) !important; } .ev.err .x { color: #ffb3bd; }
  .more { text-align: center; font: 10px "IBM Plex Mono", monospace; color: var(--g-faint); padding: 4px 0 6px; border-top: 1px solid rgba(120,150,255,.1); }
  .col { width: 158px; display: flex; flex-direction: column; gap: 7px; }
  .col .h { font: 600 10px "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }
  .cd { border-radius: 8px; border: 1.5px solid var(--b); background: linear-gradient(180deg, color-mix(in srgb, var(--b) 14%, rgba(8,12,26,.9)), rgba(8,12,26,.9)); padding: 8px 9px 7px; position: relative; cursor: pointer; }
  .cd .tt { font: 700 13px/1.2 Manrope, sans-serif; color: #f2f5ff; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; padding-right: 22px; }
  .cd .id { font: 10px "IBM Plex Mono", monospace; color: color-mix(in srgb, var(--b) 85%, white); margin-top: 4px; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: color-mix(in srgb, var(--b) 40%, transparent); }
  .cd .bd { position: absolute; right: 7px; top: 8px; min-width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font: 700 9.5px "IBM Plex Mono", monospace; color: #fff; background: color-mix(in srgb, var(--b) 70%, #10183a); }
  .cd .pr { height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); margin-top: 6px; overflow: hidden; }
  .cd .pr i { display: block; height: 100%; background: var(--b); }
  .cd.ghost { border-style: dashed; opacity: .6; background: none; }
  .center .av { width: 58px; height: 58px; }
  .center .nm { font-size: 12.5px; }
  .tools2 { position: absolute; z-index: 3; top: 52px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .tools2 > * { pointer-events: auto; }
  .seg2 { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 9px; background: rgba(12,18,36,.8); border: 1px solid rgba(120,150,255,.14); font: 500 11.5px Manrope, sans-serif; }
  .seg2 .lb { font: 600 9.5px "IBM Plex Mono", monospace; letter-spacing: .14em; color: var(--g-faint); padding: 0 8px 0 6px; text-transform: uppercase; }
  .seg2 button { background: none; border: 0; color: var(--g-dim); font: inherit; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
  .seg2 button.on { color: #1a1206; background: #e9c46a; font-weight: 700; }
  .chips { display: inline-flex; gap: 10px; padding: 6px 12px; border-radius: 9px; background: rgba(12,18,36,.8); border: 1px solid rgba(120,150,255,.14); font: 11px "IBM Plex Mono", monospace; color: var(--g-dim); }
  .chips i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .cd::before { content: ""; position: absolute; left: -1.5px; top: 6px; bottom: 6px; width: 3px; border-radius: 3px; background: var(--b); box-shadow: 0 0 10px var(--b); }
  .cd { transition: transform .15s, box-shadow .15s; }
  .cd:hover { transform: translateY(-1px); box-shadow: 0 6px 20px -8px var(--b); }
  .grp { transition: opacity .2s; }
  #world.focus .grp { opacity: .28; }
  #world.focus .grp.hl { opacity: 1; }
  #world.focus #links path, #world.focus #links circle { opacity: .12; }
  #world.focus #links .hl { opacity: 1 !important; stroke-width: 2.2; }
  .gname { display: none; position: absolute; top: -18px; left: 10px; font: 600 9.5px "IBM Plex Mono", monospace; letter-spacing: .16em; color: var(--g-faint); text-transform: uppercase; white-space: nowrap; }
  .panel { position: relative; }
  #zpct { color: var(--g-txt); min-width: 46px; text-align: center; font: 600 11.5px "IBM Plex Mono", monospace; align-self: center; }
  .hint { position: absolute; z-index: 3; left: 50%; bottom: 14px; transform: translateX(-50%); font: 11px "IBM Plex Mono", monospace; color: var(--g-dim); padding: 5px 12px; border-radius: 999px; background: rgba(12,18,36,.8); border: 1px solid rgba(120,150,255,.14); }
</style>
</head>
<body>
<script src="/assets/ao.js"></script>
<script src="/assets/live.js"></script>
<div class="wrap"><div id="hdr"></div></div>
<div id="stage">
  <div id="stars"></div>
  <div id="view"><div id="world"><svg id="links"></svg></div></div>
  <div class="bar" id="bar"></div>
  <div class="tools2" id="tools2"></div>
  <div class="hint" id="hint"></div>
  
  <div class="ctl"><button id="zo">−</button><span id="zpct"></span><button id="zi">+</button><button id="fit">⤢ Fit</button></div>
</div>
<script>
// UI state lives outside render(): session (?s=), lens, layout in the URL; camera in `cam`. Live re-renders redraw groups but never re-fit.
const t = AO.t, EN = AO.lang === 'en', L = (vi, en) => EN ? en : vi;
const qget = k => new URLSearchParams(location.search).get(k);
const setQ = (k, v) => { const p = new URLSearchParams(location.search); if (v) p.set(k, v); else p.delete(k); const s = p.toString(); history.replaceState(null, '', s ? '?' + s : location.pathname); };
const tokOf = a => a.tok.cr + a.tok.cw + a.tok.out + a.tok.in;
const esc = AO.esc, short = (x, n) => (x = String(x || '')).length > n ? x.slice(0, n - 1) + '…' : x;
const COL = { prog: 'var(--c-prog)', rev: 'var(--c-rev)', done: 'var(--c-done)', bad: 'var(--c-bad)', todo: 'var(--c-todo)' };
const ROLE = { main: '#e4c590', worker: '#b9a6ff', review: '#8fd0ff', you: '#7fe0a8' };
const hhmm = ts => AO.time(ts);
const toolTag = n => n.startsWith('mcp__') ? n.split('__').pop().replace(/^browser_/, '') : n;

// deterministic pixel avatar (9×9 mirrored robot head), coloured by role
function avatar(seed, col, size = 34) {
  let h = 2166136261; for (const c of String(seed)) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  const rnd = () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296;
  let px = ''; const shade = ['#ffffff', col, col, '#0b1024'];
  for (let y = 0; y < 9; y++) for (let x = 0; x < 5; x++) {
    let v = rnd() < (y < 2 ? .35 : y > 6 ? .45 : .62) ? 1 + (rnd() < .3 ? 1 : 0) : 0;
    if (y === 0 && x === 4) v = 1; if (y === 4 && (x === 2)) v = 3; if (y === 4 && x === 3) v = 0; if ((y === 3 || y === 5) && x === 2) v = 2;
    if (!v) continue; const c = v === 3 ? '#ffffff' : v === 2 ? col : col, o = v === 1 ? .95 : v === 2 ? .7 : 1;
    px += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c}" opacity="${o}"/>` + (x < 4 ? `<rect x="${8 - x}" y="${y}" width="1" height="1" fill="${c}" opacity="${o}"/>` : '');
  }
  return `<svg width="${size}" height="${size}" viewBox="-0.5 -0.5 10 10" shape-rendering="crispEdges"><rect x="1.5" y="1.5" width="6" height="6" rx="1" fill="#0b1024" opacity=".6"/>${px}</svg>`;
}
const nodeHtml = (seed, name, role, col, run, center, badge) => `<div class="node ${center ? 'center' : ''}"><div class="av ${run ? 'run' : ''}" style="--glow:${col}">${avatar(seed, col, center ? 44 : 34)}</div><div class="nm">${esc(name)}</div><div class="rl">${esc(role)}</div>${badge || ''}</div>`;

function activityHtml(events, agentCol, total) {
  const ev = events.slice(0, 3).map(e => { const c = e.err ? COL.bad : e.kind === 'agent' ? ROLE.worker : e.kind === 'handback' ? ROLE.review : e.kind === 'msg' ? '#ffb27a' : e.kind === 'skill' ? ROLE.main : e.kind === 'mcp' ? '#ff9fd0' : agentCol;
    return `<div class="ev ${e.err ? 'err' : ''}" style="--c:${c}"><div class="m"><b>${esc(e.who || '')}</b>${e.who ? '→' : ''}<span class="tg">${esc(toolTag(e.tool))}</span><span>${e.err ? '✕ ' + L('lỗi', 'error') : esc(e.kindLabel || '')}</span><span class="t">${hhmm(e.ts)}</span></div><div class="x">${esc(e.text || toolTag(e.tool))}</div></div>`; }).join('');
  return `<div class="actv"><div class="ttl"><span>${L('Hoạt động', 'Activity')}</span><span>${total}</span></div>${ev || `<div class="x" style="font:10.5px 'IBM Plex Mono';color:var(--g-faint);padding:4px 0 8px">—</div>`}${total > 3 ? `<div class="more">+${total - 3} ${L('nữa', 'more')}</div>` : ''}</div>`;
}
const card = (title, id, b, badge, prog, ghost, go) => `<div class="cd ${ghost ? 'ghost' : ''}" style="--b:${b}" ${go ? `data-go="${esc(go)}"` : ''}><div class="tt">${esc(title)}</div><div class="id">${esc(id)}</div>${badge != null ? `<div class="bd">${esc(badge)}</div>` : ''}${prog != null ? `<div class="pr"><i style="width:${Math.round(prog * 100)}%"></i></div>` : ''}</div>`;
const column = (head, col, cards, keepEmpty) => !cards.length && !keepEmpty ? '' : `<div class="col"><div class="h" style="color:${col}">${head}</div>${cards.join('') || `<div class="cd ghost" style="--b:var(--g-line)"><div class="id" style="text-decoration:none;color:var(--g-faint)">—</div></div>`}</div>`;
let lens = ['status', 'tokens', 'errors', 'model'].includes(qget('lens')) ? qget('lens') : 'status', layout = qget('layout') === 'columns' ? 'columns' : 'radial';
const MODELC = m => /opus/.test(m || '') ? '#b9a6ff' : /sonnet/.test(m || '') ? '#6ea8ff' : /fable/.test(m || '') ? '#ff9fd0' : /haiku/.test(m || '') ? '#5fd4c4' : '#9aa3c0';
const heat = (v, max) => { const f = Math.min(1, Math.sqrt(v / Math.max(1, max))); return f < .25 ? '#6a7392' : f < .5 ? '#c9a45c' : f < .75 ? '#f0a24a' : '#ff6b7d'; };
let MAXTOK = 1;
function lensFor(a, statusCol) { if (!a) return statusCol;
  if (lens === 'tokens') return heat(tokOf(a), MAXTOK);
  if (lens === 'errors') { const r = a.calls ? a.errs / a.calls : 0; return !a.errs ? '#6fdc9a' : r < .03 ? '#e9c46a' : r < .1 ? '#f0a24a' : '#ff6b7d'; }
  if (lens === 'model') return MODELC(a.model);
  return statusCol; }
const agentStatus = a => a.errs > 10 && a.errs / Math.max(1, a.calls) > .1 ? 'bad' : a.status === 'run' ? 'prog' : a.status === 'done' ? 'done' : a.status === 'wait' ? 'rev' : 'todo';

// ---------- build the two levels ----------
let pool = [], mode = 'all', cur = null;
function refreshData() {
  const all = AO.state === 'empty' ? [] : AO.sessions([0, Infinity]);
  const active = all.filter(s => s.status !== 'stop' || AO.NOW - s.t1 < 6 * 3600e3);
  pool = (active.length >= 3 ? active : all.slice(0, 6)).slice(0, 8);
  const sid = qget('s'); cur = sid ? all.find(s => s.id.startsWith(sid)) || null : null; mode = cur ? 'session' : 'all';
}

function groupsAll() { MAXTOK = Math.max(1, ...pool.flatMap(s => s.agents.slice(1).map(tokOf)));
  const center = { key: 'you', html: nodeHtml('you', L('Bạn', 'You'), `${pool.length} ${L('phiên đang mở', 'open sessions')}`, ROLE.you, false, true),
    panel: activityHtml(pool.flatMap(s => s.events.slice(0, 2).map(e => ({ ...e, who: short(s.title, 14), kindLabel: '' }))).sort((a, b) => b.ts - a.ts), ROLE.main, pool.reduce((x, s) => x + s.events.length, 0)) };
  const nodes = pool.map(s => { const subs = s.agents.slice(1), sc = s.status === 'wait' ? COL.rev : s.status === 'run' ? COL.prog : COL.done;
    const byCol = { prog: [], rev: [], done: [] };
    for (const a of subs) { const st = agentStatus(a), c = st === 'bad' ? COL.bad : st === 'prog' ? COL.prog : AO.role(a) === 'review' && a.status !== 'done' ? COL.rev : COL.done;
      (st === 'prog' ? byCol.prog : AO.role(a) === 'review' && a.status !== 'done' ? byCol.rev : byCol.done).push(card(a.desc || a.label, a.label + ' · ' + AO.model(a.model).split(' ')[0], lensFor(a, c), a.calls, null, false, s.id)); }
    const src = AO.sourceOf(s), solo = !subs.length || !!(src && src.capabilities && src.capabilities.subagents === false);
    const cols = solo ? [column(L('Skill', 'Skills'), ROLE.main, s.phases.slice(-2).map(p => card(p.skill.replace(/^[^:]+:/, ''), `${p.calls} ${L('lệnh', 'calls')} · ${AO.dur(p.to - p.from)}`, '#e4c590', p.errs || null, null, false, s.id))),
                         column(L('File', 'Files'), COL.done, s.files.filter(f => f.ops.W || f.ops.E).slice(0, 2).map(f => card(f.name, f.dir, f.ops.W ? COL.done : COL.prog, f.ops.W ? 'W' : 'E', null, false, s.id)))]
      : [column(L('Đang làm', 'In progress'), COL.prog, byCol.prog.slice(0, 2)), column('Review', COL.rev, byCol.rev.slice(0, 2)), column(L('Xong', 'Done'), COL.done, byCol.done.slice(-2))];
    return { key: s.id, session: s, gname: s.project, lensCol: lensFor(s.agents[0], sc), run: s.status !== 'stop', col: s.status === 'wait' ? '#ffb27a' : s.status === 'run' ? '#7fe0a8' : '#e4c590', edge: sc,
      html: nodeHtml(s.id, short(s.title, 30), `${s.project} · ${AO.model(s.agents[0].model)} · ${t('st.' + s.status)}`, s.status === 'wait' ? '#ffb27a' : s.status === 'run' ? '#7fe0a8' : '#e4c590', s.status !== 'stop', false, AO.sourceBadge(s)),
      panel: activityHtml(s.events.map(e => ({ ...e, who: e.agent === 'main' ? L('chính', 'main') : e.agent })), ROLE.main, s.events.length) + cols.join('') }; });
  return { center, nodes };
}
function groupsSession(s) {
  const main = s.agents[0], subs = s.agents.slice(1); MAXTOK = Math.max(1, ...subs.map(tokOf));
  const shown = subs.length > 8 ? [...subs].sort((a, b) => b.t1 - a.t1).slice(0, 7) : subs, more = subs.length - shown.length;
  const center = { key: 'main', gname: L('điều phối', 'orchestrator'), html: nodeHtml(s.id, short(s.title, 34), `${L('agent chính', 'main agent')} · ${AO.model(main.model)} · ${t('st.' + s.status)}`, ROLE.main, s.status !== 'stop', true),
    panel: activityHtml(main.recent.map(e => ({ ...e, who: '', kindLabel: '' })), ROLE.main, main.calls) +
      column(L('Skill', 'Skills'), ROLE.main, s.phases.slice(-3).reverse().map((p, i) => card(p.skill.replace(/^[^:]+:/, ''), `${AO.time(p.from)} · ${p.calls} ${L('lệnh', 'calls')}`, i === 0 && s.status !== 'stop' ? COL.prog : '#e4c590', p.spawns ? '➤' + p.spawns : null))) +
      column(L('Giao việc', 'Delegated'), ROLE.worker, s.spawns.slice(-3).reverse().map(p => { const a = subs.find(x => x.desc === p.desc); return card(p.desc || 'agent', `${a ? a.label : ''} · ${p.model || ''} · ${AO.time(p.ts)}`, a ? (agentStatus(a) === 'prog' ? COL.prog : agentStatus(a) === 'bad' ? COL.bad : COL.done) : COL.todo, null); })) };
  const nodes = shown.map(a => { const st = agentStatus(a), role = AO.role(a), rc = role === 'review' ? ROLE.review : ROLE.worker, b = st === 'bad' ? COL.bad : st === 'prog' ? COL.prog : st === 'done' ? COL.done : COL.todo;
    const files = (a.fileList || []).filter(f => f.op !== 'R').slice(0, 2), reads = (a.fileList || []).filter(f => f.op === 'R').slice(0, 2);
    const tools = (a.tools || []).slice(0, 2).map(([n, v]) => card(toolTag(n), `${v} ${L('lệnh', 'calls')}${a.toolErr && a.toolErr[n] ? ' · ✕' + a.toolErr[n] : ''}`, a.toolErr && a.toolErr[n] && a.toolErr[n] / v > .1 ? COL.bad : n.startsWith('mcp__') ? '#ff9fd0' : '#6ea8ff', v));
    return { key: a.key, agent: a, run: a.status === 'run', col: rc, edge: b, lensCol: lensFor(a, b), gname: (role === 'review' ? 'review · ' : 'worker · ') + a.label,
      html: nodeHtml(a.label + s.id, `${a.label} · ${role === 'review' ? 'Reviewer' : L('Worker', 'Worker')}`, `${AO.model(a.model)} · ${AO.tok(tokOf(a))}`, lens === 'status' ? rc : lensFor(a, rc), a.status === 'run'),
      panel: activityHtml(a.recent.map(e => ({ ...e, who: '', kindLabel: '' })), rc, a.calls) +
        column(L('Nhiệm vụ · file', 'Task · files'), lensFor(a, b), [card(a.desc || a.label, `${a.label} · ${t('st.' + a.status)} · ${AO.dur(a.t1 - a.t0)}`, lensFor(a, b), a.errs ? '✕' + a.errs : null, a.status === 'done' ? 1 : a.status === 'run' ? .6 : .3)].concat((role === 'review' ? reads : files.length ? files : reads).slice(0, 2).map(f => card(f.name, f.dir, f.op === 'W' ? COL.done : f.op === 'E' ? COL.prog : COL.todo, f.op)))) +
        
        column(L('Công cụ', 'Tools'), '#6ea8ff', tools) }; });
  if (more) nodes.push({ key: 'more', run: false, col: '#8d97b8', edge: 'var(--g-faint)', html: nodeHtml('more' + s.id, `+${more} agent`, L('đã ẩn bớt', 'collapsed'), '#8d97b8', false), panel: '' });
  // review links: Rn ↔ Tn
  const pairs = []; for (const r of shown.filter(a => AO.role(a) === 'review')) { const m = r.label.match(/^R(\d+)/); const w = m && shown.find(a => a.label === 'T' + m[1]); if (w) pairs.push([r.key, w.key]); }
  return { center, nodes, pairs };
}

// ---------- layout + render ----------
const world = document.getElementById('world'), svg = document.getElementById('links'), view = document.getElementById('view');
let cam = { x: 0, y: 0, k: .6 }, G = null, userCam = false;
let first = true;
function render(D) {
  document.getElementById('hdr').innerHTML = AO.header('graph');
  refreshData();
  const sig = mode + (cur ? cur.id : '');
  draw(first || sig !== render.sig); first = false; render.sig = sig;
  AO.init();
}
function draw(refit) {
  G = mode === 'all' ? groupsAll() : groupsSession(cur);
  world.querySelectorAll('.grp').forEach(n => n.remove());
  const mk = (g) => { const d = document.createElement('div'); d.className = 'grp'; d.dataset.k = g.key; d.innerHTML = g.html + (g.panel ? `<div class="panel">${g.gname ? `<span class="gname">${esc(g.gname)}</span>` : ''}${g.panel}</div>` : ''); world.appendChild(d); g.el = d; return d; };
  mk(G.center); G.nodes.forEach(mk);
  // measure, then place centre at origin and groups on an ellipse (top first, clockwise)
  const size = g => [g.el.offsetWidth, g.el.offsetHeight];
  const [cw, ch] = size(G.center); G.center.x = -cw / 2; G.center.y = -ch / 2;
  const n = G.nodes.length, maxW = Math.max(...G.nodes.map(g => size(g)[0]), 300), maxH = Math.max(...G.nodes.map(g => size(g)[1]), 200);
  const rx = Math.max(cw / 2 + maxW / 2 + 70, (n * (maxW * .78 + 40)) / (2 * Math.PI)), ry = Math.max(ch / 2 + maxH / 2 + 70, rx * .6);
  if (layout === 'columns') { const colH = Math.max(900, ch * 1.6), gap = 34; let x = cw / 2 + 220, y = 0, colW = 0, cols = [[]];
    for (const g of G.nodes) { const [w, h] = size(g); if (y + h > colH && cols[cols.length - 1].length) { x += colW + 160; y = 0; colW = 0; cols.push([]); } g.x = x; g.y = y; y += h + gap; colW = Math.max(colW, w); cols[cols.length - 1].push(g); }
    for (const c of cols) { const tot = c.reduce((m, g) => Math.max(m, g.y + size(g)[1]), 0); c.forEach(g => g.y -= tot / 2); }
    G.center.x = -cw / 2 - 40; }
  else G.nodes.forEach((g, i) => { const a = -Math.PI / 2 + i / n * Math.PI * 2, [w, h] = size(g); g.cx = Math.cos(a) * rx; g.cy = Math.sin(a) * ry; g.x = g.cx - w / 2; g.y = g.cy - h / 2; });
  // resolve overlaps (simple push-apart on bounding boxes)
  if (layout !== 'columns') for (let it = 0; it < 60; it++) for (let i = 0; i < G.nodes.length; i++) for (let j = i + 1; j < G.nodes.length; j++) { const A = G.nodes[i], B = G.nodes[j], [aw, ah] = size(A), [bw, bh] = size(B);
    const ox = Math.min(A.x + aw, B.x + bw) - Math.max(A.x, B.x) + 40, oy = Math.min(A.y + ah, B.y + bh) - Math.max(A.y, B.y) + 40;
    if (ox > 0 && oy > 0) { if (ox < oy) { const d = (A.x < B.x ? -1 : 1) * ox / 2; A.x += d; B.x -= d; } else { const d = (A.y < B.y ? -1 : 1) * oy / 2; A.y += d; B.y -= d; } } }
  for (const g of [G.center, ...G.nodes]) { g.el.style.left = g.x + 'px'; g.el.style.top = g.y + 'px'; }
  // links: centre avatar → node avatar (curved), animated dot when running; dashed review links
  const O = 6000, av = g => { const a = g.el.querySelector('.av'); return [g.x + a.offsetLeft + a.offsetWidth / 2, g.y + a.offsetTop + a.offsetHeight / 2]; };
  const [cx, cy] = av(G.center); let s = '';
  for (const g of G.nodes) { const [x, y] = av(g); let d;
    if (layout === 'columns') { const mx = (cx + x) / 2; d = `M${cx + O} ${cy + O} C${mx + O} ${cy + O} ${mx + O} ${y + O} ${x + O} ${y + O}`; }
    else { const mx = (cx + x) / 2 + (y - cy) * .18, my = (cy + y) / 2 - (x - cx) * .18; d = `M${cx + O} ${cy + O} Q${mx + O} ${my + O} ${x + O} ${y + O}`; }
    const ec = lens === 'status' ? 'rgba(120,150,255,.3)' : g.lensCol || 'rgba(120,150,255,.3)';
    s += `<path data-k="${g.key}" d="${d}" fill="none" stroke="${ec}" stroke-opacity="${lens === 'status' ? 1 : .55}" stroke-width="1.4"/>`;
    if (g.run) s += `<path data-k="${g.key}" d="${d}" fill="none" stroke="${g.col}" stroke-width="1.6" stroke-dasharray="6 14" opacity=".9"><animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.4s" repeatCount="indefinite"/></path><circle data-k="${g.key}" r="3" fill="${g.col}"><animateMotion dur="2.6s" repeatCount="indefinite" path="${d}"/></circle>`; }
  for (const [a, b] of (G.pairs || [])) { const A = G.nodes.find(g => g.key === a), B = G.nodes.find(g => g.key === b); if (!A || !B) continue; const [x1, y1] = av(A), [x2, y2] = av(B);
    s += `<path d="M${x1 + O} ${y1 + O} Q${(x1 + x2) / 2 + O} ${Math.min(y1, y2) - 120 + O} ${x2 + O} ${y2 + O}" fill="none" stroke="rgba(143,208,255,.45)" stroke-width="1.2" stroke-dasharray="3 5"/>
      <text x="${(x1 + x2) / 2 + O}" y="${Math.min(y1, y2) - 66 + O}" fill="#8fd0ff" font-family="IBM Plex Mono" font-size="11" text-anchor="middle">review</text>`; }
  svg.innerHTML = s;
  // interactions inside groups
  world.querySelectorAll('[data-go]').forEach(el => el.onclick = e => { e.stopPropagation(); go(el.dataset.go); });
  G.nodes.forEach(g => { const nd = g.el.querySelector('.node'); nd.onclick = e => { e.stopPropagation(); if (g.session) go(g.session.id); else if (g.agent) location.href = '/session.html?id=' + encodeURIComponent(cur.id) + '&v=detail'; }; });
  G.center.el.querySelector('.node').onclick = e => { e.stopPropagation(); if (mode === 'session') go(null); };
  // hover: focus a group and its link
  const W2 = document.getElementById('world');
  [G.center, ...G.nodes].forEach(g => { g.el.onmouseenter = () => { W2.classList.add('focus'); g.el.classList.add('hl'); G.center.el.classList.add('hl'); svg.querySelectorAll(`[data-k="${g.key}"]`).forEach(p => p.classList.add('hl')); if (g === G.center) W2.querySelectorAll('.grp').forEach(x => x.classList.add('hl')); };
    g.el.onmouseleave = () => { W2.classList.remove('focus'); W2.querySelectorAll('.hl').forEach(x => x.classList.remove('hl')); svg.querySelectorAll('.hl').forEach(x => x.classList.remove('hl')); }; });

  if (refit) fit(); else apply();
}
function tools2() {
  const lenses = [['status', L('Trạng thái', 'Status')], ['tokens', 'Token'], ['errors', L('Lỗi', 'Errors')], ['model', 'Model']];
  const lays = [['radial', L('Vòng', 'Radial')], ['columns', L('Cột', 'Columns')]];
  const chips = lens === 'status' ? [['#6ea8ff', L('Đang làm', 'In progress')], ['#e9c46a', L('Review / chờ', 'Review / waiting')], ['#6fdc9a', L('Xong', 'Done')], ['#ff6b7d', L('Lỗi', 'Errors')]]
    : lens === 'tokens' ? [['#6a7392', L('ít', 'low')], ['#c9a45c', ''], ['#f0a24a', ''], ['#ff6b7d', L('nhiều nhất', 'highest')]]
    : lens === 'errors' ? [['#6fdc9a', L('không lỗi', 'none')], ['#e9c46a', '<3%'], ['#f0a24a', '3–10%'], ['#ff6b7d', '>10%']]
    : [['#b9a6ff', 'Opus'], ['#6ea8ff', 'Sonnet'], ['#ff9fd0', 'Fable'], ['#5fd4c4', 'Haiku']];
  document.getElementById('tools2').innerHTML = `<span class="seg2"><span class="lb">${L('Tô màu theo', 'Colour by')}</span>${lenses.map(([k, l]) => `<button data-l="${k}" class="${lens === k ? 'on' : ''}">${l}</button>`).join('')}</span>
    <span class="seg2"><span class="lb">${L('Bố cục', 'Layout')}</span>${lays.map(([k, l]) => `<button data-y="${k}" class="${layout === k ? 'on' : ''}">${l}</button>`).join('')}</span>
    <span class="chips">${chips.map(([c, l]) => `<span><i style="background:${c};box-shadow:0 0 6px ${c}"></i>${l}</span>`).join('')}</span>`;
  document.querySelectorAll('#tools2 [data-l]').forEach(b => b.onclick = () => { lens = b.dataset.l; setQ('lens', lens === 'status' ? '' : lens); draw(true); });
  document.querySelectorAll('#tools2 [data-y]').forEach(b => b.onclick = () => { layout = b.dataset.y; setQ('layout', layout === 'radial' ? '' : layout); draw(true); });
}
function go(id) { setQ('s', id ? id.slice(0, 8) : ''); refreshData(); render.sig = mode + (cur ? cur.id : ''); draw(true); }
function bar() {
  const opts = AO.sessions([0, Infinity]).slice(0, 40).map(s => `<option value="${esc(s.id)}" ${cur && cur.id === s.id ? 'selected' : ''}>${esc(short(s.title, 48))} · ${t('st.' + s.status)}</option>`).join('');
  document.getElementById('bar').innerHTML = `<span class="tab ${mode === 'all' ? 'on' : ''}" id="tAll">👥 ${L('Tất cả', 'All')} · ${pool.length}</span>
    <span class="tab ${mode === 'session' ? 'on' : ''}">🛰 <select id="sel"><option value="">${L('Chọn phiên…', 'Pick a session…')}</option>${opts}</select></span>
    ${mode === 'session' ? `<span class="tab on" style="cursor:default">⎇ ${L('Sơ đồ', 'Graph')} · ${cur.agents.length} agent</span><a class="tab" href="/session.html?id=${encodeURIComponent(cur.id)}">${t('a.open')} ↗</a>${AO.resumeBtn(cur, cur.status === 'wait').replace('class="act', 'class="tab')}` : ''}`;
  document.getElementById('tAll').onclick = () => go(null);
  document.getElementById('sel').onchange = e => go(e.target.value || null);
  document.getElementById('hint').textContent = mode === 'all' ? L('Bấm một phiên để xem đội agent của nó · kéo để di chuyển · cuộn để phóng', 'Click a session to open its agent team · drag to pan · scroll to zoom')
    : L('Bấm agent chính để quay lại · bấm thẻ/agent để xem chi tiết', 'Click the main agent to go back · click a card/agent for details');
}
void `<span><i style="border-color:var(--c-prog)"></i>${L('Đang làm', 'In progress')}</span><span><i style="border-color:var(--c-rev)"></i>${L('Review / chờ', 'Review / waiting')}</span><span><i style="border-color:var(--c-done)"></i>${L('Xong', 'Done')}</span><span><i style="border-color:var(--c-bad)"></i>${L('Lỗi', 'Errors')}</span>`;

// ---------- pan / zoom ----------
function apply() { const zp = document.getElementById('zpct'); if (zp) zp.textContent = Math.round(cam.k * 100) + '%'; world.style.transform = `translate(${view.clientWidth / 2 - cam.x * cam.k}px, ${view.clientHeight / 2 - cam.y * cam.k}px) scale(${cam.k})`; }
function fit() { const gs = [G.center, ...G.nodes]; let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const g of gs) { a = Math.min(a, g.x); b = Math.min(b, g.y); c = Math.max(c, g.x + g.el.offsetWidth); d = Math.max(d, g.y + g.el.offsetHeight); }
  cam = { x: (a + c) / 2, y: (b + d) / 2 + 10, k: Math.min(1.2, Math.min((view.clientWidth - 40) / (c - a), (view.clientHeight - 130) / (d - b))) }; cam.y -= 20 / cam.k; if (cam.k < .62 && !fit.all) { cam.k = .62; cam.x = G.center.x + G.center.el.offsetWidth / 2; cam.y = G.center.y + G.center.el.offsetHeight / 2 - 40; } fit.all = false; apply(); }
let drag = null;
view.addEventListener('pointerdown', e => { if (e.target.closest('.cd, .node')) return; userCam = true; drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; view.setPointerCapture(e.pointerId); view.classList.add('drag'); });
view.addEventListener('pointermove', e => { if (!drag) return; cam.x = drag.cx - (e.clientX - drag.x) / cam.k; cam.y = drag.cy - (e.clientY - drag.y) / cam.k; apply(); });
view.addEventListener('pointerup', () => { drag = null; view.classList.remove('drag'); });
view.addEventListener('wheel', e => { e.preventDefault(); userCam = true; const r = view.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const wx = (mx - view.clientWidth / 2) / cam.k + cam.x, wy = (my - view.clientHeight / 2) / cam.k + cam.y; cam.k = Math.max(.15, Math.min(2.5, cam.k * Math.exp(-e.deltaY * .0015)));
  cam.x = wx - (mx - view.clientWidth / 2) / cam.k; cam.y = wy - (my - view.clientHeight / 2) / cam.k; apply(); }, { passive: false });
document.getElementById('zi').onclick = () => { userCam = true; cam.k = Math.min(2.5, cam.k * 1.3); apply(); };
document.getElementById('zo').onclick = () => { userCam = true; cam.k = Math.max(.15, cam.k / 1.3); apply(); };
document.getElementById('fit').onclick = () => { userCam = false; fit.all = true; fit(); };
addEventListener('resize', () => apply());
AO.live(render);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (G && !userCam) draw(true); });
