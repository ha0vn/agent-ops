<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/ao.css">
<style>
  /* Question: "which skills and tools do my agents lean on, and which ones fail?" */
  .g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; align-items: start; }
  .g3 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .sk { display: grid; grid-template-columns: minmax(0, 1fr) 90px 44px 52px; gap: 12px; align-items: center; height: 30px; border-top: 1px solid var(--hair); font-size: 13px; }
  .sk:first-of-type { border-top: 0; }
  .sk .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .sk .n em { font-style: normal; color: var(--faint); font-size: 11px; margin-left: 6px; }
  .chain { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--hair); }
  .chain:first-of-type { border-top: 0; }
  .chain .nd { padding: 4px 9px; border-radius: 7px; border: 1px solid var(--hair2); font-size: 12px; }
  .chain .ar { color: var(--gold); }
  .chain .ct { margin-left: auto; font-size: 11.5px; color: var(--dim); white-space: nowrap; }
  .tl { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 56px 86px 50px; gap: 12px; align-items: center; height: 25px; font-size: 13px; }
  .tl .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grp { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); margin: 12px 0 4px; display: flex; justify-content: space-between; }
  .grp:first-child { margin-top: 0; }
  .srv { border: 1px solid color-mix(in srgb, var(--mcp) 26%, transparent); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .srv .h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 8px; }
  .srv .h b { color: var(--mcp); font-weight: 500; }
  .srv .row { display: grid; grid-template-columns: minmax(0, 1fr) 70px 36px; gap: 10px; align-items: center; height: 22px; font-size: 12px; }
  .srv .row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  .heat { display: grid; gap: 3px; font-size: 10.5px; align-items: center; }
  .heat .h { color: var(--faint); text-align: center; }
  .heat .l { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .heat .c { height: 20px; border-radius: 3px; position: relative; }
  .heat .c.err::after { content: ""; position: absolute; right: 3px; top: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--bad); }
  .mrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) 50px 64px; gap: 10px; align-items: center; height: 28px; font-size: 13px; }
  @media (max-width: 1200px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<script src="/assets/ao.js"></script>
<script src="/assets/live.js"></script>
<div class="wrap" id="app"></div>
<script>
AO.live(function render(D) {
const app = document.getElementById('app');
const { t } = AO, NOW = AO.NOW, W = AO.win();
const list = AO.list(W);
let h = AO.banner();
if (!list.length) { h += `<div class="panel" style="margin-top:16px">${AO.emptyState()}</div>`; app.innerHTML = AO.header('skills') + h; AO.init(); return; }

// aggregate tools (all agents), skills, mcp, chains
const tools = {}; for (const s of list) for (const [n, v] of Object.entries(s.tools)) { const x = tools[n] = tools[n] || { n: 0, err: 0, ms: 0, msN: 0, sess: 0 }; x.n += v.n; x.err += v.err; x.ms += v.ms; x.msN += v.msN; x.sess++; }
const calls = Object.values(tools).reduce((a, v) => a + v.n, 0), errs = Object.values(tools).reduce((a, v) => a + v.err, 0);
const skills = {}; for (const s of list) for (const k of s.skills) { const x = skills[k.name] = skills[k.name] || { n: 0, sess: new Set(), last: 0 }; x.n++; x.sess.add(s.id); x.last = Math.max(x.last, k.ts || 0); }
const mcp = {}; for (const s of list) for (const [sv, ts] of Object.entries(s.mcp)) { const x = mcp[sv] = mcp[sv] || { tools: {}, sess: 0 }; x.sess++; for (const [k, v] of Object.entries(ts)) x.tools[k] = (x.tools[k] || 0) + v; }
const mcpErr = sv => Object.entries(tools).filter(([n]) => n.startsWith('mcp__' + sv + '__')).reduce((a, [, v]) => a + v.err, 0);
const chains = {}; for (const s of list) { const seq = s.skills.filter(k => k.name).map(k => k.name.replace('superpowers:', '')).filter((x, i, a) => x !== a[i - 1]); if (seq.length < 2) continue;
  const key = seq.join(' → '); const c = chains[key] = chains[key] || { n: 0, agents: 0 }; c.n++; c.agents += s.agents.length - 1; }
const subs = list.flatMap(s => s.agents.slice(1));
const delegations = list.reduce((a, s) => a + s.spawns.length, 0);
const worst = Object.entries(tools).filter(([, v]) => v.n >= 20).sort((a, b) => b[1].err / b[1].n - a[1].err / a[1].n)[0];

h += `<div class="strip" style="--n:6;margin-top:16px">
  <div><div class="eyebrow">${t('k.calls')}</div><div class="v">${AO.n(calls)}</div><div class="d">${list.length} ${t('k.sessions').toLowerCase()}</div></div>
  <div><div class="eyebrow">${t('k.errors')}</div><div class="v">${AO.pct(errs / calls)}</div><div class="d">${AO.n(errs)} / ${AO.n(calls)}</div></div>
  <div><div class="eyebrow">${t('k.skills')}</div><div class="v">${Object.keys(skills).length}</div><div class="d">${Object.values(skills).reduce((a, v) => a + v.n, 0)}×</div></div>
  <div><div class="eyebrow">MCP</div><div class="v">${Object.keys(mcp).length}</div><div class="d">${AO.n(Object.values(mcp).reduce((a, m) => a + Object.values(m.tools).reduce((b, c) => b + c, 0), 0))} ${t('c.calls').toLowerCase()}</div></div>
  <div><div class="eyebrow">${t('f.agent')}</div><div class="v">${delegations}</div><div class="d">${subs.length} ${t('k.subagents').toLowerCase()}</div></div>
  <div><div class="eyebrow">${AO.lang === 'en' ? 'Most failing' : 'Lỗi nhiều nhất'}</div><div class="v" style="font-size:19px;margin-top:8px">${worst ? AO.esc(worst[0].replace(/^mcp__.*__/, '').slice(0, 18)) : '—'}</div><div class="d ${worst && worst[1].err / worst[1].n > .1 ? 'bad' : ''}">${worst ? AO.pct(worst[1].err / worst[1].n) + ' · ' + worst[1].n : ''}</div></div>
</div>`;

// skills + chains
const skRows = Object.entries(skills).sort((a, b) => b[1].n - a[1].n);
const maxSess = Math.max(...skRows.map(([, v]) => v.sess.size), 1);
h += `<div class="g2"><section class="panel"><div class="ph"><h3>${t('p.skills')}</h3><span class="r">${AO.lang === 'en' ? 'calls · sessions · last' : 'lần gọi · số phiên · gần nhất'}</span></div>
  ${skRows.map(([n, v]) => { const [src, nm] = n.includes(':') ? n.split(':') : ['', n];
    return `<div class="sk"><span class="n">${AO.esc(nm)}<em>${AO.esc(src)}</em></span><div class="share"><i style="width:${v.sess.size / maxSess * 100}%;background:var(--gold)"></i></div><span class="r num">${v.n}×</span><span class="r num dim">${AO.date(v.last)}</span></div>`; }).join('') || '<div class="dim">—</div>'}
  <div class="ph" style="margin-top:18px"><h3>${t('p.chains')}</h3><span class="r">${AO.lang === 'en' ? 'order within a session' : 'thứ tự trong một phiên'}</span></div>
  ${Object.entries(chains).sort((a, b) => b[1].n - a[1].n).slice(0, 6).map(([k, v]) => `<div class="chain">${k.split(' → ').map(x => `<span class="nd">${AO.esc(x)}</span>`).join('<span class="ar">→</span>')}<span class="ct">${v.n} ${t('k.sessions').toLowerCase()}${v.agents ? ` · ${v.agents} ${t('k.subagents').toLowerCase()}` : ''}</span></div>`).join('') || '<div class="dim">—</div>'}
</section>`;

// tools grouped with error flags on the row
const groupsDef = [['Built-in', n => !n.startsWith('mcp__') && !/^(Agent|SendMessage|SubagentHandback|Skill|ToolSearch|REPL|Poll|TaskStop|Monitor)$/.test(n)],
  [AO.lang === 'en' ? 'Code & waiting' : 'Chạy mã & chờ', n => /^(REPL|Poll|TaskStop|Monitor)$/.test(n)],
  [AO.lang === 'en' ? 'Coordination' : 'Điều phối', n => /^(Agent|SendMessage|SubagentHandback|Skill|ToolSearch)$/.test(n)], ['MCP', n => n.startsWith('mcp__')]];
const tmax = Math.max(...Object.values(tools).map(v => v.n), 1);
h += `<section class="panel"><div class="ph"><h3>${t('p.tools')}</h3><span class="r">${t('c.calls')} · ${t('c.errs')} · ${t('c.avg')}</span></div>
  ${groupsDef.map(([g, f]) => { let rs = Object.entries(tools).filter(([n]) => f(n)).sort((a, b) => b[1].n - a[1].n); if (!rs.length) return '';
    const more = rs.length > 7 ? rs.slice(7) : []; rs = rs.slice(0, 7);
    return `<div class="grp"><span>${g}</span><span>${AO.n(rs.concat(more).reduce((a, [, v]) => a + v.n, 0))}</span></div>` + rs.map(([n, v]) => { const r = v.err / v.n, bad = r > .1 && v.n >= 20;
      const col = n.startsWith('mcp__') ? 'var(--mcp)' : g === 'Built-in' ? 'var(--review)' : 'var(--gold)';
      return `<div class="tl"><span class="n" title="${AO.esc(n)}">${AO.esc(n.replace(/^mcp__(claude_ai_)?/, '').replace('__', ' · '))}</span><div class="share"><i style="width:${v.n / tmax * 100}%;background:${col}"></i></div><span class="r num">${AO.n(v.n)}</span>
        <span class="r">${v.err ? (bad ? `<span class="flag bad">${v.err} · ${AO.pct(r, 0)}</span>` : `<span class="dim num">${v.err} · ${AO.pct(r, 0)}</span>`) : '<span class="faint">—</span>'}</span>
        <span class="r num faint" style="font-size:11.5px">${v.msN ? (v.ms / v.msN < 1000 ? Math.round(v.ms / v.msN) + 'ms' : AO.n(v.ms / v.msN / 1000, 1) + 's') : ''}</span></div>`; }).join('') + (more.length ? `<div class="faint" style="font-size:11.5px">+${more.length}</div>` : ''); }).join('')}
</section></div>`;

// MCP servers, tools by day heatmap, sub-agents by model
const days = []; for (let d = W[0]; d <= NOW; d += 864e5) days.push(AO.dayKey(d));
const topT = Object.entries(tools).sort((a, b) => b[1].n - a[1].n).slice(0, 8).map(([n]) => n);
const cell = (d, n) => list.reduce((a, s) => a + (((s.toolsByDay || {})[d] && s.toolsByDay[d].tools[n]) || 0), 0);
const dayErr = d => list.reduce((a, s) => a + (((s.toolsByDay || {})[d] && s.toolsByDay[d].err) || 0), 0), dayN = d => list.reduce((a, s) => a + (((s.toolsByDay || {})[d] && s.toolsByDay[d].n) || 0), 0);
const hm = Math.max(...topT.flatMap(n => days.map(d => cell(d, n))), 1);
const step = days.length > 14 ? Math.ceil(days.length / 10) : 1;
const byModel = {}; for (const a of subs) { const m = AO.model(a.model); const x = byModel[m] = byModel[m] || { n: 0, tok: 0, cost: 0 }; x.n++; x.tok += a.tok.in + a.tok.out + a.tok.cw + a.tok.cr; x.cost += a.cost; }
const subCost = Object.values(byModel).reduce((a, v) => a + v.cost, 0) || 1;
h += `<div class="g3">
  <section class="panel"><div class="ph"><h3>${t('p.mcp')}</h3><span class="r">${Object.keys(mcp).length}</span></div>
    ${Object.entries(mcp).map(([sv, m]) => { const tot = Object.values(m.tools).reduce((a, b) => a + b, 0), e = mcpErr(sv), mx2 = Math.max(...Object.values(m.tools));
      return `<div class="srv"><div class="h"><b>${AO.esc(sv.replace('claude_ai_', ''))}</b><span class="dim" style="font-size:11.5px">${tot} · ${m.sess} ${t('k.sessions').toLowerCase()} ${e ? `<span class="flag ${e / tot > .1 ? 'bad' : 'warn'}">${e} · ${AO.pct(e / tot, 0)}</span>` : ''}</span></div>
        ${Object.entries(m.tools).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, v]) => `<div class="row"><span>${AO.esc(k)}</span><div class="share"><i style="width:${v / mx2 * 100}%;background:var(--mcp)"></i></div><span class="r num">${v}</span></div>`).join('')}</div>`; }).join('') || '<div class="dim">—</div>'}
  </section>
  <section class="panel"><div class="ph"><h3>${t('p.toolday')}</h3><span class="r">${AO.lang === 'en' ? 'darker = more · red dot = error day' : 'đậm = nhiều · chấm đỏ = ngày nhiều lỗi'}</span></div>
    <div class="heat" style="grid-template-columns:96px repeat(${days.length}, minmax(0,1fr))"><span></span>${days.map((d, i) => `<span class="h">${i % step ? '' : d.slice(8)}</span>`).join('')}
    ${topT.map(n => `<span class="l" title="${AO.esc(n)}">${AO.esc(n.replace(/^mcp__.*__/, ''))}</span>` + days.map(d => { const v = cell(d, n), lv = v ? Math.ceil(Math.sqrt(v / hm) * 4) : 0;
      return `<span class="c" style="background:${lv ? `color-mix(in srgb, var(--gold) ${[0, 14, 26, 40, 58][lv]}%, transparent)` : 'var(--hair)'}" data-tip="${AO.tip(`<b>${v}</b>${AO.esc(n)} · ${d.slice(8)}/${d.slice(5, 7)}`)}"></span>`; }).join('')).join('')}
    <span class="l">${t('k.errors')}</span>${days.map(d => { const n = dayN(d), e = dayErr(d); return `<span class="c ${n >= 20 && e / n > .06 ? 'err' : ''}" style="background:var(--hair)" data-tip="${AO.tip(`<b>${e} / ${n}</b>${n ? AO.pct(e / n) : ''}`)}"></span>`; }).join('')}</div>
  </section>
  <section class="panel"><div class="ph"><h3>${t('p.submodel')}</h3><span class="r">${subs.length}</span></div>
    ${Object.entries(byModel).sort((a, b) => b[1].cost - a[1].cost).map(([m, v]) => `<div class="mrow"><span>${AO.esc(m)}</span><div class="share"><i style="width:${v.cost / subCost * 100}%;background:var(--worker)"></i></div><span class="r num dim">${v.n}</span><span class="r num">${AO.usd(v.cost)}</span></div>`).join('') || '<div class="dim">—</div>'}
    <div class="faint" style="font-size:11.5px;margin-top:8px">${AO.lang === 'en' ? 'agents · est. cost' : 'agent · quy đổi'}</div>
  </section></div>`;
app.innerHTML = AO.header('skills') + h;
AO.init();
});
</script>
</body>
</html>
